name: World Transition QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transition-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website code
        uses: actions/checkout@v4

      - name: Checkout private article content
        uses: actions/checkout@v4
        with:
          repository: KJDhole/Blog
          token: ${{ secrets.BLOG_CONTENT_TOKEN }}
          path: .blog-content

      - name: Overlay private articles
        run: |
          rm -rf src/content/posts
          mkdir -p src/content/posts
          cp -a .blog-content/posts/. src/content/posts/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit and contract tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/blog-preview.log 2>&1 &
          curl --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:4321/ -o /dev/null
      - name: Capture signature world transition frames
        run: node scripts/world-transition-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-transition-qa
          path: world-transition-qa/
