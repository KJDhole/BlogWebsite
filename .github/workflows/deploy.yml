name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website code
        uses: actions/checkout@v4

      - name: Checkout private article content
        uses: actions/checkout@v4
        with:
          repository: KJDhole/Blog
          token: ${{ secrets.BLOG_CONTENT_TOKEN }}
          path: .blog-content

      - name: Overlay private articles
        run: |
          rm -rf src/content/posts
          mkdir -p src/content/posts
          cp -a .blog-content/posts/. src/content/posts/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
