name: Blog V1 CI

on:
  push:
    branches:
      - feat/blog-v1-content-system
  pull_request:
    branches:
      - main

concurrency:
  group: blog-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Existing prototype tests
        run: node --test prototype/tests/*.test.mjs
      - name: Blog V1 migration tests
        run: npm test
      - name: Build
        run: npm run build
