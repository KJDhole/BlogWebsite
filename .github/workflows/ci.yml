name: CI

on:
  push:
    branches:
      - main
      - feat/blog-v1-content-system
  pull_request:
    branches:
      - main

concurrency:
  group: blog-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify production blog output
        run: |
          test -f dist/index.html
          test -f dist/writing/commerce-agent-rules/index.html
          test -f dist/archive/index.html
          test -f dist/tags/index.html
          test -f dist/tags/ai/index.html
          test -f dist/tags/agent/index.html
          test -f dist/tags/architecture/index.html
          test -f dist/404.html
          test -f dist/rss.xml
          ls dist/sitemap*.xml >/dev/null
          grep -q "Study in public" dist/index.html
          grep -q "Commerce Agent 的 24 条设计法则" dist/index.html
          grep -q "Commerce Agent 的 24 条设计法则" dist/rss.xml
          if grep -R "const articles = \[" src; then
            echo "Found a hardcoded article catalog"
            exit 1
          fi
      - name: Prove Markdown-only publishing
        run: |
          cat > src/content/posts/verification-sixth-post.md <<'EOF'
          ---
          title: "Verification Sixth Post"
          description: "Temporary acceptance fixture proving Markdown-only publishing."
          date: 2026-09-04
          category: Thinking
          tags:
            - Verification
          visual: paper
          draft: false
          ---

          Temporary acceptance fixture proving Markdown-only publishing.
          EOF
          npm run build
          test -f dist/writing/verification-sixth-post/index.html
          grep -q "Verification Sixth Post" dist/index.html
          grep -q "Verification Sixth Post" dist/archive/index.html
          grep -q "Verification Sixth Post" dist/rss.xml
          rm src/content/posts/verification-sixth-post.md
