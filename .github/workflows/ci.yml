name: CI

on:
  push:
    branches:
      - main
      - feat/blog-v1-content-system
  pull_request:
    branches:
      - main

concurrency:
  group: blog-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify generated routes and homepage order
        run: |
          test -f dist/index.html
          test -f dist/writing/commerce-agent-rules/index.html
          test -f dist/writing/ai-native-development/index.html
          test -f dist/writing/agent-memory-notes/index.html
          test -f dist/writing/claude-code-workflow/index.html
          test -f dist/writing/building-in-public/index.html
          if grep -R "const articles = \[" src; then
            echo "Found a hardcoded article catalog"
            exit 1
          fi
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          const html = readFileSync('dist/index.html', 'utf8')
          const titles = [
            'Commerce Agent 的 24 条设计法则',
            'AI Native 开发到底改变了什么',
            '我对 Agent 记忆系统的一些思考',
            'Claude Code + 自定义指令的工作流',
            '为什么我选择公开构建所有项目'
          ]
          let cursor = -1
          for (const title of titles) {
            const next = html.indexOf(title)
            if (next < 0 || next <= cursor) throw new Error(`Homepage order/content mismatch: ${title}`)
            cursor = next
          }
          NODE
      - name: Prove Markdown-only publishing
        run: |
          cat > src/content/posts/verification-sixth-post.md <<'EOF'
          ---
          title: "Verification Sixth Post"
          description: "Temporary acceptance fixture proving Markdown-only publishing."
          date: 2026-09-04
          category: Thinking
          tags:
            - Verification
          visual: paper
          draft: false
          ---

          Temporary acceptance fixture proving Markdown-only publishing.
          EOF
          npm run build
          test -f dist/writing/verification-sixth-post/index.html
          grep -q "Verification Sixth Post" dist/index.html
          rm src/content/posts/verification-sixth-post.md
