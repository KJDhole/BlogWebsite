name: Absorption QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright for QA only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/blog-preview.log 2>&1 &
          curl --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:4321/ -o /dev/null
      - name: Capture absorption boundary frames
        run: node scripts/absorption-qa.mjs
      - name: Upload absorption QA
        uses: actions/upload-artifact@v4
        with:
          name: absorption-qa
          path: absorption-qa/
